<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Perplexity Archive</title>
    <style>
        :root{--cyan:#20B8CD;--offblack:#13343B;--off-white:#FCFAF6}
        *{box-sizing:border-box;margin:0;padding:0}
        body{font-family:-apple-system,sans-serif;background:var(--off-white);color:var(--offblack)}
        .header{background:var(--offblack);color:white;padding:16px 32px;display:flex;justify-content:space-between;align-items:center}
        .logo{font-weight:600;font-size:18px;color:white;text-decoration:none}
        .back-link{color:rgba(255,255,255,0.7);text-decoration:none}
        .main{padding:32px;max-width:1200px;margin:0 auto}
        .stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:32px}
        .stat-card{background:white;padding:20px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,0.1)}
        .stat-label{font-size:12px;color:#666;text-transform:uppercase}
        .stat-value{font-size:32px;font-weight:700}
        .section{background:white;border-radius:12px;padding:20px;margin-bottom:24px;box-shadow:0 2px 8px rgba(0,0,0,0.1)}
        .section-title{font-weight:600;margin-bottom:16px}
        .cron-box{display:flex;align-items:center;gap:12px;padding:12px;background:#f5f5f5;border-radius:8px;margin-bottom:8px}
        .cron-dot{width:10px;height:10px;border-radius:50%;background:#2E8B57}
        @media(max-width:768px){.stats-grid{grid-template-columns:repeat(2,1fr)}}
    </style>
</head>
<body>
    <header class="header">
        <a href="index.html" class="logo">Perplexity Archive</a>
        <a href="index.html" class="back-link">Back to Archive</a>
    </header>
    <main class="main">
        <div class="stats-grid">
            <div class="stat-card"><div class="stat-label">Articles</div><div class="stat-value" id="statArticles">-</div></div>
            <div class="stat-card"><div class="stat-label">Sources</div><div class="stat-value" id="statSources">-</div></div>
            <div class="stat-card"><div class="stat-label">Categories</div><div class="stat-value" id="statCategories">-</div></div>
            <div class="stat-card"><div class="stat-label">Avg Sources</div><div class="stat-value" id="statAvg">-</div></div>
        </div>
        <div class="section">
            <div class="section-title">Scheduled Tasks</div>
            <div class="cron-box"><div class="cron-dot"></div><div>Ingestion - Hourly at :00</div></div>
            <div class="cron-box"><div class="cron-dot"></div><div>Enhance - Hourly at :15</div></div>
            <div class="cron-box"><div class="cron-dot"></div><div>Secondary Ingestion - Hourly at :30</div></div>
        </div>
        <div class="section">
            <div class="section-title">Categories</div>
            <div id="categoryList">Loading...</div>
        </div>
    </main>
    <script>
        async function loadDashboard(){try{const res=await fetch('./data.json');const data=await res.json();document.getElementById('statArticles').textContent=data.stats.article_count;document.getElementById('statSources').textContent=data.stats.source_count;document.getElementById('statCategories').textContent=data.stats.category_count;document.getElementById('statAvg').textContent=(data.stats.source_count/data.stats.article_count).toFixed(1);document.getElementById('categoryList').innerHTML=data.stats.categories.map(c=>`<div style="padding:8px 0;border-bottom:1px solid #eee">${c.category}: ${c.count} articles</div>`).join('')}catch(e){console.error(e)}}
        loadDashboard();
    </script>
</body>
</html>
