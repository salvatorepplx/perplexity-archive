<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - The Perplexity Archive</title>
    <style>
        :root{--offblack:#13343B;--cyan:#20B8CD;--paper:#F3F3EE;--off-white:#FCFAF6;--warm-beige:#E5E3D4;--medium-teal:#2E565D;--chart-3:#2E8B57;--font-body:'DM Sans',-apple-system,sans-serif;--font-mono:'JetBrains Mono',monospace}
        *{box-sizing:border-box;margin:0;padding:0}
        body{font-family:var(--font-body);background:var(--off-white);color:var(--offblack);min-height:100vh;line-height:1.5}
        .header{background:var(--offblack);color:white;padding:16px 32px;display:flex;align-items:center;justify-content:space-between}
        .logo{display:flex;align-items:center;gap:10px;color:white;text-decoration:none;font-weight:600;font-size:18px}
        .badge{background:rgba(32,184,205,0.15);color:var(--cyan);padding:4px 12px;border-radius:100px;font-size:12px;font-weight:600;text-transform:uppercase}
        .back-link{color:rgba(255,255,255,0.7);text-decoration:none;font-size:14px}
        .back-link:hover{color:var(--cyan)}
        .main-content{padding:32px;max-width:1200px;margin:0 auto}
        .stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:32px}
        .stat-card{background:white;border-radius:12px;padding:20px;border:1px solid var(--warm-beige)}
        .stat-label{font-size:12px;color:var(--medium-teal);font-weight:600;text-transform:uppercase;margin-bottom:6px}
        .stat-value{font-size:32px;font-weight:700;color:var(--offblack);line-height:1}
        .section{background:white;border-radius:12px;border:1px solid var(--warm-beige);margin-bottom:24px}
        .section-header{padding:16px 20px;border-bottom:1px solid var(--warm-beige);font-weight:600}
        .section-content{padding:20px}
        .cron-box{display:flex;align-items:center;gap:12px;padding:16px;background:var(--paper);border-radius:8px;margin-bottom:8px}
        .cron-dot{width:10px;height:10px;border-radius:50%;background:var(--chart-3);animation:pulse 2s ease infinite}
        @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
        .cron-info{flex:1}
        .cron-label{font-weight:600;font-size:14px}
        .cron-detail{font-size:12px;color:var(--medium-teal)}
        .cron-id{font-family:var(--font-mono);font-size:11px;color:var(--medium-teal);background:white;padding:4px 8px;border-radius:4px}
        .activity-log{max-height:300px;overflow-y:auto}
        .log-entry{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--paper);font-size:13px}
        .log-time{font-family:var(--font-mono);font-size:11px;color:var(--medium-teal);min-width:60px}
        .log-badge{font-size:10px;font-weight:600;text-transform:uppercase;padding:2px 6px;border-radius:3px;background:rgba(32,184,205,0.15);color:var(--medium-teal)}
        .log-text{flex:1}
        .log-category{font-size:11px;color:var(--medium-teal);background:var(--paper);padding:2px 6px;border-radius:3px}
    </style>
</head>
<body>
    <header class="header">
        <div style="display:flex;align-items:center;gap:16px">
            <a href="index.html" class="logo">Perplexity Archive</a>
            <span class="badge">Dashboard</span>
        </div>
        <a href="index.html" class="back-link">Back to Archive</a>
    </header>
    <main class="main-content">
        <div class="stats-grid" id="statsGrid">
            <div class="stat-card"><div class="stat-label">Articles</div><div class="stat-value" id="statArticles">-</div></div>
            <div class="stat-card"><div class="stat-label">Sources</div><div class="stat-value" id="statSources">-</div></div>
            <div class="stat-card"><div class="stat-label">Categories</div><div class="stat-value" id="statCategories">-</div></div>
            <div class="stat-card"><div class="stat-label">Avg Sources</div><div class="stat-value" id="statAvg">-</div></div>
        </div>
        <div class="section">
            <div class="section-header">Scheduled Tasks</div>
            <div class="section-content">
                <div class="cron-box"><div class="cron-dot"></div><div class="cron-info"><div class="cron-label">Ingestion (Primary)</div><div class="cron-detail">Hourly at :00</div></div><div class="cron-id">de771409</div></div>
                <div class="cron-box"><div class="cron-dot" style="background:var(--chart-3)"></div><div class="cron-info"><div class="cron-label">Enhance & Iterate</div><div class="cron-detail">Hourly at :15</div></div><div class="cron-id">ea42d864</div></div>
                <div class="cron-box"><div class="cron-dot" style="background:var(--cyan)"></div><div class="cron-info"><div class="cron-label">Ingestion (Secondary)</div><div class="cron-detail">Hourly at :30</div></div><div class="cron-id">ad207ec7</div></div>
            </div>
        </div>
        <div class="section">
            <div class="section-header">Recent Activity</div>
            <div class="section-content"><div class="activity-log" id="activityLog"><p>Loading activity...</p></div></div>
        </div>
    </main>
    <script>
        async function loadDashboard() {
            try {
                const res = await fetch('./data.json');
                const data = await res.json();
                document.getElementById('statArticles').textContent = data.stats.article_count.toLocaleString();
                document.getElementById('statSources').textContent = data.stats.source_count.toLocaleString();
                document.getElementById('statCategories').textContent = data.stats.category_count;
                document.getElementById('statAvg').textContent = (data.stats.source_count / data.stats.article_count).toFixed(1);
                renderActivity(data.articles);
            } catch (err) {
                console.error('Failed to load data:', err);
            }
        }
        function renderActivity(articles) {
            const sorted = [...articles].filter(a => a.created_at).sort((a, b) => new Date(b.created_at) - new Date(a.created_at)).slice(0, 15);
            document.getElementById('activityLog').innerHTML = sorted.map(a => `<div class="log-entry"><span class="log-time">${formatTime(a.created_at)}</span><span class="log-badge">New</span><span class="log-text">${escapeHtml(a.title)}</span><span class="log-category">${escapeHtml(a.category)}</span></div>`).join('');
        }
        function formatTime(dateStr) { return new Date(dateStr).toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: false }); }
        function escapeHtml(str) { const div = document.createElement('div'); div.textContent = str || ''; return div.innerHTML; }
        loadDashboard();
    </script>
</body>
</html>
